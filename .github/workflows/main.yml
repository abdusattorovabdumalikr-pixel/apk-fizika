name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK yig'ish (debug, o'rnatishga tayyor)
        run: gradle assembleDebug --no-daemon

      - name: Nomini o'zgartirish
        run: cp app/build/outputs/apk/debug/app-debug.apk Tebranma-harakatlar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tebranma-harakatlar-apk
          path: Tebranma-harakatlar.apk

      - name: Release (faqat v* tegida)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Tebranma-harakatlar.apk
